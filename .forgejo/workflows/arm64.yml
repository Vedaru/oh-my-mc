# Linux arm64 build, kept out of the push pipeline on purpose.
#
# This job is correct and was green as recently as 4bee9c9a (71s). Since then the
# aarch64 runner (`runs-on: glibc`) has failed every job one second after start,
# including a throwaway `run: 'echo hello'` - so the container is never created and
# no step of this file ever runs. Nothing in this repository can fix that.
#
# Leaving it in ci.yml therefore did not test arm64; it turned every push red for
# a reason unrelated to the commit, which is how a real regression goes unnoticed.
# Run it by hand once the runner is back:
#
#   POST /api/v1/repos/{owner}/{repo}/actions/workflows/arm64.yml/dispatches
#   {"ref": "master"}
#
# A green run here publishes into the same `rolling` release, and
# publish_release.sh only replaces assets whose name contains its own target, so
# recovering x64 builds are unaffected.
name: arm64
on:
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # Linux arm64. The runner image carries the hand-assembled aarch64 toolchain,
  # because upstream ships no arm64 Linux SDK (the arrangement is documented by
  # tool/ci/assemble_arm64_toolchain.sh and reproduced at image build time).
  # ---------------------------------------------------------------------------
  build-linux-arm64:
    runs-on: glibc
    timeout-minutes: 120
    steps:
      - name: Show the runner image
        run: |
          set -eu
          cat /etc/ci-image-versions.txt
          uname -m

      - name: Check out this repository
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/oh-my-mc"
          rm -rf "$src"
          helper='!f() { echo "username=x"; printf "password=%s\n" "$FORGEJO_TOKEN"; }; f'
          git -c credential.helper= -c "credential.helper=$helper" \
              clone --quiet --depth 1 \
              http://127.0.0.1:3000/${{ forge.repository }}.git "$src"
          echo "SRC=$src" >> "$GITHUB_ENV"

      - name: Build
        # --no-tree-shake-icons is not optional here: the engine's font-subset
        # binary has no arm64 build, so tree-shaking icons cannot run. Skipping it
        # costs a larger icon font and nothing else.
        run: |
          set -euo pipefail
          cd "$SRC"
          flutter pub get
          flutter build linux --release --no-tree-shake-icons

      - name: Verify the binary is really arm64
        run: |
          set -euo pipefail
          cd "$SRC"
          bin=build/linux/arm64/release/bundle/oh_my_mc
          file "$bin"
          # The verifier deliberately has no arm64-Linux expectation (no shipped
          # target is arm64 Linux), so read e_machine out of the ELF header. Byte
          # 18-19 of an ELF64 header is e_machine: 0xb7 is aarch64, 0x3e is x86-64.
          mach=$(od -An -tx1 -j18 -N2 "$bin" | tr -d ' \n')
          echo "e_machine=0x$mach"
          [ "$mach" = "b700" ] || { echo "expected aarch64 (0xb700), got 0x$mach" >&2; exit 1; }

      - name: Package
        run: bash "$SRC/tool/ci/package_linux.sh" "$SRC" linux-arm64

      - name: Publish rolling release
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
          FORGEJO_URL: http://127.0.0.1:3000
          FORGEJO_REPOSITORY: ${{ forge.repository }}
          SHA: ${{ forge.sha }}
        run: bash "$SRC/tool/ci/publish_release.sh" "$SRC" linux-arm64 "$SHA"
