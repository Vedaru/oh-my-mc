# CI for oh my mc, on this instance's own runners.
#
# Everything unusual here is instance constraint, learned from the workflows that
# already work here (linear-cli-rs, obscura, kuro, jev-project):
#
#   * `runs-on` selects a LABEL, and the label names an image. `glibc` is the
#     aarch64 runner, `glibc-amd64` the x86_64 one. Both are Linux. There is no
#     macOS or Windows runner on this instance, so those artifacts cannot come
#     from here at all - see .github/workflows/ci.yml and docs/PLAN.md 3.5.
#   * No `actions/checkout` and no marketplace action: the default action source
#     is github.com, unreachable here, and the label image has no node. The
#     checkout is a plain `git clone` over loopback.
#   * Cloudflare drops the TLS ClientHello from this host on the public name, so
#     everything talks to 127.0.0.1:3000, never https://git.vedaru.cn.
#   * A per-job `container:` block is ignored by this runner and Docker Hub is
#     unreachable, so the image comes from the label and the toolchain is
#     installed inside the job.
#   * Only `forge.repository` and `forge.sha` are known-good expressions here.
#
# The heavy lifting lives in tool/ci/*.sh rather than in YAML so it can be run and
# tested outside CI. Each of those scripts was exercised locally before being
# wired in; the first real run failed on a bare `curl` of the 1.5 GB SDK, which is
# why fetch_flutter_sdk.sh retries and resumes.
name: ci

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # Gate. Runs on the amd64 runner on purpose: stock Flutter works there with no
  # hybrid assembly, so this is the fastest and most trustworthy signal. The
  # arm64 job is the one with a hand-built toolchain, and a gate that depends on
  # the fragile setup is a gate you learn to ignore.
  # ---------------------------------------------------------------------------
  gate:
    runs-on: glibc-amd64
    timeout-minutes: 60
    steps:
      - name: Install build dependencies
        run: |
          set -eux
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -y
          apt-get install -y --no-install-recommends \
              ca-certificates curl git unzip xz-utils python3 \
              libgtk-3-dev libsecret-1-dev pkg-config \
              cmake ninja-build clang

      - name: Check out this repository
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/oh-my-mc"
          rm -rf "$src"
          helper='!f() { echo "username=x"; printf "password=%s\n" "$FORGEJO_TOKEN"; }; f'
          git -c credential.helper= -c "credential.helper=$helper" \
              clone --quiet --depth 1 \
              http://127.0.0.1:3000/${{ forge.repository }}.git "$src"
          echo "checked out $(git -C "$src" rev-parse HEAD)"
          echo "SRC=$src" >> "$GITHUB_ENV"

      - name: Fetch the Flutter SDK
        run: |
          set -euo pipefail
          bash "$SRC/tool/ci/fetch_flutter_sdk.sh" "$RUNNER_TEMP" 3.47.7
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Gate - format, analyze, test
        # Every check runs and the step fails once at the end, so a red run names
        # everything that is wrong rather than only the first thing.
        run: |
          set -uo pipefail
          cd "$SRC"
          rc=0
          check() {
            local name="$1"; shift
            echo "=== $name ==="
            if "$@"; then echo "PASS: $name"; else echo "FAIL: $name"; rc=1; fi
          }
          flutter pub get
          check "dart format" dart format --output=none --set-exit-if-changed lib test tool
          check "flutter analyze" flutter analyze --fatal-infos
          check "flutter test" flutter test
          if [ "$rc" -eq 0 ]; then echo "gate: PASS"; else echo "gate: FAIL"; fi
          exit "$rc"

  # ---------------------------------------------------------------------------
  # Linux x64. Native build on a native x64 host. Not cross-compiled: the tool
  # refuses both directions (build_linux.dart: x64->arm64 is "not currently
  # supported", arm64->x64 is "cross-building only supported on Linux x64 hosts").
  # ---------------------------------------------------------------------------
  build-linux-x64:
    runs-on: glibc-amd64
    needs: gate
    timeout-minutes: 90
    steps:
      - name: Install build dependencies
        run: |
          set -eux
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -y
          apt-get install -y --no-install-recommends \
              ca-certificates curl git unzip xz-utils python3 \
              libgtk-3-dev libsecret-1-dev pkg-config \
              cmake ninja-build clang

      - name: Check out this repository
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/oh-my-mc"
          rm -rf "$src"
          helper='!f() { echo "username=x"; printf "password=%s\n" "$FORGEJO_TOKEN"; }; f'
          git -c credential.helper= -c "credential.helper=$helper" \
              clone --quiet --depth 1 \
              http://127.0.0.1:3000/${{ forge.repository }}.git "$src"
          echo "SRC=$src" >> "$GITHUB_ENV"

      - name: Fetch the Flutter SDK
        run: |
          set -euo pipefail
          bash "$SRC/tool/ci/fetch_flutter_sdk.sh" "$RUNNER_TEMP" 3.47.7
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Build
        run: |
          set -euo pipefail
          cd "$SRC"
          flutter pub get
          flutter build linux --release

      - name: Verify the binary is really x64
        run: |
          set -euo pipefail
          cd "$SRC"
          bin=build/linux/x64/release/bundle/oh_my_mc
          file "$bin"
          dart run tool/verify_binary_arch.dart --file="$bin" --expect=linux-x64

      - name: Package
        run: bash "$SRC/tool/ci/package_linux.sh" "$SRC" linux-x64

      - name: Publish rolling release
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
          FORGEJO_URL: http://127.0.0.1:3000
          FORGEJO_REPOSITORY: ${{ forge.repository }}
          SHA: ${{ forge.sha }}
        run: bash "$SRC/tool/ci/publish_release.sh" "$SRC" linux-x64 "$SHA"

  # ---------------------------------------------------------------------------
  # Linux arm64. Hand-assembled toolchain, because upstream ships no arm64 SDK.
  # assemble_arm64_toolchain.sh documents and reproduces the arrangement.
  # ---------------------------------------------------------------------------
  build-linux-arm64:
    runs-on: glibc
    needs: gate
    timeout-minutes: 120
    steps:
      - name: Install build dependencies
        run: |
          set -eux
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -y
          apt-get install -y --no-install-recommends \
              ca-certificates curl git unzip xz-utils python3 \
              libgtk-3-dev libsecret-1-dev pkg-config \
              cmake ninja-build clang

      - name: Check out this repository
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/oh-my-mc"
          rm -rf "$src"
          helper='!f() { echo "username=x"; printf "password=%s\n" "$FORGEJO_TOKEN"; }; f'
          git -c credential.helper= -c "credential.helper=$helper" \
              clone --quiet --depth 1 \
              http://127.0.0.1:3000/${{ forge.repository }}.git "$src"
          echo "SRC=$src" >> "$GITHUB_ENV"

      - name: Assemble the arm64 Flutter toolchain
        run: |
          set -euo pipefail
          bash "$SRC/tool/ci/assemble_arm64_toolchain.sh" "$RUNNER_TEMP" 3.47.7
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Build
        # --no-tree-shake-icons is not optional here: the engine's font-subset
        # binary has no arm64 build, so tree-shaking icons cannot run. Skipping it
        # costs a larger icon font and nothing else.
        run: |
          set -euo pipefail
          cd "$SRC"
          flutter pub get
          flutter build linux --release --no-tree-shake-icons

      - name: Verify the binary is really arm64
        run: |
          set -euo pipefail
          cd "$SRC"
          bin=build/linux/arm64/release/bundle/oh_my_mc
          file "$bin"
          # The verifier deliberately has no arm64-Linux expectation (no shipped
          # target is arm64 Linux), so read e_machine out of the ELF header. Byte
          # 18-19 of an ELF64 header is e_machine: 0xb7 is aarch64, 0x3e is x86-64.
          mach=$(od -An -tx1 -j18 -N2 "$bin" | tr -d ' \n')
          echo "e_machine=0x$mach"
          [ "$mach" = "b700" ] || { echo "expected aarch64 (0xb700), got 0x$mach" >&2; exit 1; }

      - name: Package
        run: bash "$SRC/tool/ci/package_linux.sh" "$SRC" linux-arm64

      - name: Publish rolling release
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
          FORGEJO_URL: http://127.0.0.1:3000
          FORGEJO_REPOSITORY: ${{ forge.repository }}
          SHA: ${{ forge.sha }}
        run: bash "$SRC/tool/ci/publish_release.sh" "$SRC" linux-arm64 "$SHA"
