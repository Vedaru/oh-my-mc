# Temporary: which runs-on labels actually start a container?
name: labelprobe
on:
  workflow_dispatch:
jobs:
  l0:
    runs-on: glibc
    timeout-minutes: 2
    steps:
      - run: 'echo hello from glibc'
  l1:
    runs-on: glibc-amd64
    timeout-minutes: 2
    steps:
      - run: 'echo hello from glibc-amd64'
  l2:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: 'echo hello from ubuntu-latest'
  l3:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - run: 'echo hello from ubuntu-24.04'
  l4:
    runs-on: docker
    timeout-minutes: 2
    steps:
      - run: 'echo hello from docker'
  l5:
    runs-on: arm64
    timeout-minutes: 2
    steps:
      - run: 'echo hello from arm64'
  l6:
    runs-on: aarch64
    timeout-minutes: 2
    steps:
      - run: 'echo hello from aarch64'
  l7:
    runs-on: linux-arm64
    timeout-minutes: 2
    steps:
      - run: 'echo hello from linux-arm64'
  l8:
    runs-on: linux
    timeout-minutes: 2
    steps:
      - run: 'echo hello from linux'
  l9:
    runs-on: default
    timeout-minutes: 2
    steps:
      - run: 'echo hello from default'
