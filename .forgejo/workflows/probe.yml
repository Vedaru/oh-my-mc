name: probe
on:
  workflow_dispatch:
jobs:
  # Does the runner start a container at all? One command that cannot fail.
  minimal:
    runs-on: glibc
    timeout-minutes: 5
    steps:
      - name: Hello
        run: 'echo hello'

  # Does the pre-baked image exist? Cannot fail either way; the conclusion says
  # whether /etc/ci-image-versions.txt was present only if the job starts.
  image:
    runs-on: glibc
    timeout-minutes: 5
    steps:
      - name: Report image presence without failing
        run: |
          if [ -f /etc/ci-image-versions.txt ]; then
            echo "IMAGE_PRESENT"
            cat /etc/ci-image-versions.txt
          else
            echo "IMAGE_MISSING"
            uname -m
            head -2 /etc/os-release
            command -v flutter || echo "no flutter"
            command -v git || echo "no git"
            command -v curl || echo "no curl"
            command -v python3 || echo "no python3"
          fi
