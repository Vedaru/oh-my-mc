name: probe
on:
  workflow_dispatch:
jobs:
  # Expected to fail: proves the runner is dead for any job shape.
  plain:
    runs-on: glibc
    timeout-minutes: 5
    steps:
      - run: 'echo hello'

  # Question: does this runner honour job-level continue-on-error? If it does,
  # this job's conclusion is success and the run stays green.
  tolerated:
    runs-on: glibc
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - run: 'echo hello'
