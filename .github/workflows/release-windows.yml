# Windows installer, built on GitHub's Windows runner.
#
# Flutter cannot cross-compile to Windows from Linux, and this instance has no
# Windows machine at all, so the only place a click-to-install .exe can be produced
# is a GitHub-hosted `windows-latest` runner. This workflow is GitHub-only on
# purpose: the Forgejo runner here cannot build it, and a workflow that silently
# skips is worse than one that does not exist.
#
# What it produces: `oh-my-mc-<version>-windows-x64-setup.exe`, attached to a
# GitHub Release. Push a tag `v1.0.0`, or run it by hand with a version string.
name: release-windows

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version for the installer (e.g. 1.0.0)'
        required: true
        default: '0.0.0-dev'

# Only the publishing job needs to write releases.
permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pinned: the project tracks the same version the Linux CI image carries,
          # and a floating `stable` would make a release build depend on the day.
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ github.event.inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "building $version"

      - name: Build
        run: |
          flutter pub get
          flutter build windows --release --build-name=${{ steps.version.outputs.value }}

      - name: Check the binary exists
        shell: bash
        run: |
          set -euo pipefail
          # The Inno script copies this folder; a rename in pubspec would otherwise
          # fail inside the installer compiler with a much worse message.
          exe="build/windows/x64/runner/Release/oh_my_mc.exe"
          test -f "$exe" || { echo "missing $exe"; ls -R build/windows | head -50; exit 1; }

      - name: Install Inno Setup
        # Preinstalled on some images, not guaranteed: the choco package is the
        # stable way to get ISCC.exe at a known path.
        run: choco install innosetup --no-progress -y

      - name: Compile the installer
        shell: bash
        run: |
          set -euo pipefail
          iscc="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          test -f "$iscc" || { echo "ISCC not found"; ls "/c/Program Files (x86)" | head -30; exit 1; }
          "$iscc" "/DMyAppVersion=${{ steps.version.outputs.value }}" \
                  "packaging/windows/oh-my-mc.iss"
          ls -l dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/*.exe
          if-no-files-found: error

      - name: Publish the release
        # Only on a tag: a manual run should be able to build without publishing.
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          # The installer is the whole point; the name says what it is and for whom.
          files: dist/*.exe
          generate_release_notes: true
          name: 'oh my mc ${{ steps.version.outputs.value }}'
