# Windows + macOS builds for oh my mc.
#
# These two targets cannot be built on the Forgejo instance: both of its runners
# are Linux (`glibc` = aarch64, `glibc-amd64` = x86_64), and Flutter cannot
# cross-compile a Windows or macOS app from Linux at all. Linux x64/arm64 are
# built on Forgejo (see .forgejo/workflows/ci.yml); this file covers only what
# that instance structurally cannot do.
#
# The source of truth is the Forgejo repository; this workflow clones it from the
# public URL rather than trusting that GitHub's copy is current, so a green run
# here always describes the same commit Forgejo built.
name: ci-desktop

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: 3.47.7
  UPSTREAM_REPO: https://git.vedaru.cn/Vedaru/oh-my-mc.git

jobs:
  build:
    name: build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            os: windows-latest
          - target: macos-arm64
            os: macos-14
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out the Forgejo source of truth
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/oh-my-mc"
          rm -rf "$src"
          git clone --quiet --depth 1 "$UPSTREAM_REPO" "$src"
          echo "checked out $(git -C "$src" rev-parse HEAD)"
          echo "SRC=$src" >> "$GITHUB_ENV"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # macOS ships arm-only by decision (docs/PLAN.md 3.5). Without this the
      # release build is a universal x86_64+arm64 binary.
      - name: Configure macOS arm-only
        if: matrix.target == 'macos-arm64'
        shell: bash
        run: flutter config --enable-macos-arm64-only

      - name: Build
        shell: bash
        working-directory: ${{ env.SRC }}
        run: |
          set -euo pipefail
          flutter pub get
          case "${{ matrix.target }}" in
            windows-x64) flutter build windows --release ;;
            macos-arm64) flutter build macos   --release ;;
          esac

      - name: Verify binary architecture (Windows)
        if: matrix.target == 'windows-x64'
        shell: bash
        working-directory: ${{ env.SRC }}
        run: |
          set -euo pipefail
          bin=build/windows/x64/runner/Release/oh_my_mc.exe
          dart run tool/verify_binary_arch.dart --file="$bin" --expect=windows-x64

      - name: Verify binary architecture (macOS, must be arm64-only)
        if: matrix.target == 'macos-arm64'
        shell: bash
        working-directory: ${{ env.SRC }}
        run: |
          set -euo pipefail
          bin=build/macos/Build/Products/Release/oh_my_mc.app/Contents/MacOS/oh_my_mc
          arches=$(lipo -archs "$bin")
          echo "architectures: $arches"
          case "$arches" in
            *x86_64*)
              echo "::error::expected arm64-only, got: $arches"
              exit 1 ;;
          esac
          echo "$arches" | grep -qw arm64

      - name: Package (Windows)
        if: matrix.target == 'windows-x64'
        shell: pwsh
        working-directory: ${{ env.SRC }}
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* `
            -DestinationPath "dist/oh-my-mc-${{ matrix.target }}.zip"

      - name: Package (macOS)
        if: matrix.target == 'macos-arm64'
        shell: bash
        working-directory: ${{ env.SRC }}
        run: |
          set -euo pipefail
          mkdir -p dist
          # ditto, not zip: zip drops symlinks and resource forks inside a .app.
          ditto -c -k --sequesterRsrc --keepParent \
            build/macos/Build/Products/Release/oh_my_mc.app \
            "dist/oh-my-mc-${{ matrix.target }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: oh-my-mc-${{ matrix.target }}
          path: ${{ env.SRC }}/dist/*
          if-no-files-found: error
          retention-days: 14
