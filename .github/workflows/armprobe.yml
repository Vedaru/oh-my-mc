# Temporary: does a native arm64 Linux runner exist for this public repo, and can
# it build+run the Flutter linux arm64 target natively?
name: armprobe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - run: |
          uname -m
          nproc
          cat /etc/os-release | head -2
