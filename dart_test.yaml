# The screenshot harness (test/dbg_shots_test.dart) is a visual-inspection tool,
# not an assertion: its goldens are text-bearing pages rendered with host fonts,
# so a run on Windows or macOS diffs every pixel and proves nothing.
#
# Default runs skip it; to regenerate or eyeball the shots:
#   flutter test test/dbg_shots_test.dart --run-skipped --update-goldens
tags:
  shots:
    skip: "visual harness — run with --run-skipped"
  # The end-to-end install paths talk to Mojang/Fabric/Forge/NeoForge, download
  # hundreds of megabytes and run an installer jar. CI has no JVM and no budget
  # for that; run it by hand:
  #   flutter test test/e2e --tags e2e --run-skipped
  e2e:
    skip: "network- and JVM-heavy — run with --tags e2e --run-skipped"
